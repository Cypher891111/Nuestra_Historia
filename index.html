<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Historia de Amor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        
        .font-cursive { font-family: 'Dancing Script', cursive; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

        .night-sky-bg {
            background: 
                linear-gradient(to bottom, rgba(10, 20, 38, 0.4), rgba(5, 10, 20, 0.85)),
                url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat fixed;
        }

        .star {
            position: fixed;
            background-color: #ffffff;
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            animation: twinkle var(--duration, 3s) infinite ease-in-out var(--delay, 0s);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.5); box-shadow: 0 0 10px #7dd3fc; }
        }

        .shooting-star {
            position: fixed;
            top: 20%;
            right: -10%;
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,1), rgba(125,211,252,0.8), transparent);
            filter: drop-shadow(0 0 8px #7dd3fc);
            transform: rotate(-35deg);
            z-index: 2;
            pointer-events: none;
            animation: shoot 6s infinite ease-in-out;
        }

        @keyframes shoot {
            0% { transform: translateX(0) translateY(0) rotate(-35deg); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: translateX(-90vw) translateY(60vh) rotate(-35deg); opacity: 0; }
            100% { transform: translateX(-90vw) translateY(60vh) rotate(-35deg); opacity: 0; }
        }
    </style>
</head>
<body class="night-sky-bg text-slate-100 antialiased min-h-screen relative overflow-x-hidden">

    <div id="stars-container"></div>
    <div class="shooting-star"></div>

    <!-- Encabezado -->
    <header class="relative overflow-hidden py-12 md:py-20 px-4 text-center z-10">
        <div class="max-w-3xl mx-auto space-y-4 relative z-10 bg-slate-950/40 p-6 md:p-8 rounded-3xl backdrop-blur-sm border border-cyan-500/20 shadow-2xl">
            <h1 class="font-cursive text-4xl sm:text-5xl md:text-7xl text-cyan-200 font-bold drop-shadow-[0_4px_12px_rgba(0,0,0,0.8)]">Nuestra Historia de Amor</h1>
            <p class="text-sky-100 text-sm sm:text-base md:text-xl font-light drop-shadow-md">
                Un espacio dedicado a cada aventura, proyecto y momento inolvidable a tu lado.
            </p>
        </div>
    </header>

    <!-- Contador de Tiempo -->
    <section class="max-w-4xl mx-auto px-4 -mt-2 md:-mt-4 relative z-20">
        <div class="bg-slate-950/75 backdrop-blur-md shadow-2xl rounded-2xl p-4 md:p-6 border border-cyan-500/30 text-center">
            <h2 class="text-cyan-200 font-semibold mb-3 md:mb-4 uppercase tracking-wider text-xs md:text-base">Tiempo Juntos</h2>
            <div id="counter" class="grid grid-cols-2 sm:grid-cols-4 gap-3 md:gap-4 text-sky-100">
                <div class="bg-slate-900/80 p-3 rounded-xl border border-cyan-900/50 shadow-inner">
                    <span id="days" class="text-2xl md:text-3xl font-bold block text-cyan-300">0</span>
                    <span class="text-xs text-sky-300">Días</span>
                </div>
                <div class="bg-slate-900/80 p-3 rounded-xl border border-cyan-900/50 shadow-inner">
                    <span id="hours" class="text-2xl md:text-3xl font-bold block text-cyan-300">0</span>
                    <span class="text-xs text-sky-300">Horas</span>
                </div>
                <div class="bg-slate-900/80 p-3 rounded-xl border border-cyan-900/50 shadow-inner">
                    <span id="minutes" class="text-2xl md:text-3xl font-bold block text-cyan-300">0</span>
                    <span class="text-xs text-sky-300">Minutos</span>
                </div>
                <div class="bg-slate-900/80 p-3 rounded-xl border border-cyan-900/50 shadow-inner">
                    <span id="seconds" class="text-2xl md:text-3xl font-bold block text-cyan-300">0</span>
                    <span class="text-xs text-sky-300">Segundos</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Sección Principal y Filtros -->
    <main class="max-w-4xl mx-auto px-4 py-8 md:py-12 space-y-6 md:space-y-8 relative z-10">
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-950/60 p-4 rounded-2xl border border-cyan-900/40 backdrop-blur-sm">
            <h3 class="text-xl md:text-2xl font-bold text-slate-100 flex items-center gap-2 text-center sm:text-left">
                <i class="fas fa-star text-cyan-300 text-base md:text-lg"></i> Nuestros Proyectos y Aventuras
            </h3>
            <button onclick="openModal()" class="w-full sm:w-auto bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2.5 rounded-xl shadow-lg shadow-cyan-950/50 transition flex justify-center items-center gap-2 text-sm font-semibold border border-cyan-400/30">
                <i class="fas fa-plus"></i> Añadir Recuerdo
            </button>
        </div>

        <!-- Botones de Filtro por Categoría -->
        <div class="flex flex-wrap gap-2 justify-center pb-2">
            <button onclick="filterCategory('Cine', this)" class="category-btn bg-cyan-600 text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition border border-cyan-400/30 shadow">🎬 Cine</button>
            <button onclick="filterCategory('Viajes', this)" class="category-btn bg-slate-900/80 text-slate-300 hover:text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition border border-cyan-900/50">✈️ Viajes</button>
            <button onclick="filterCategory('Musica', this)" class="category-btn bg-slate-900/80 text-slate-300 hover:text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition border border-cyan-900/50">🎵 Música</button>
            <button onclick="filterCategory('Cumpleaños', this)" class="category-btn bg-slate-900/80 text-slate-300 hover:text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition border border-cyan-900/50">🎂 Cumpleaños</button>
        </div>

        <!-- Galería -->
        <div id="gallery" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Contenido dinámico -->
        </div>
    </main>

    <!-- Modal para Añadir / Editar -->
    <div id="modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-slate-900 border border-cyan-900/60 rounded-2xl p-5 md:p-6 max-w-md w-full shadow-2xl space-y-4 my-auto">
            <h4 id="modalTitle" class="text-lg md:text-xl font-bold text-slate-100">Añadir Nuevo Momento</h4>
            <input id="editIndex" type="hidden" value="-1">

            <input id="titleInput" type="text" placeholder="Título de la aventura o evento" class="w-full bg-slate-950 border border-cyan-900 rounded-xl p-3 text-sm text-slate-100 outline-none focus:border-cyan-400">
            
            <div class="space-y-1">
                <label class="text-xs text-cyan-300 font-medium">Categoría:</label>
                <select id="categoryInput" class="w-full bg-slate-950 border border-cyan-900 rounded-xl p-3 text-sm text-slate-100 outline-none focus:border-cyan-400">
                    <option value="Cine">🎬 Cine (Terror, Acción, Ficción, Amor, Animes)</option>
                    <option value="Viajes">✈️ Viajes</option>
                    <option value="Musica">🎵 Música</option>
                    <option value="Cumpleaños">🎂 Cumpleaños</option>
                </select>
            </div>

            <div class="space-y-1">
                <label class="text-xs text-cyan-300 font-medium">Fecha (Opcional):</label>
                <input id="dateInput" type="date" class="w-full bg-slate-950 border border-cyan-900 rounded-xl p-3 text-sm text-slate-100 outline-none focus:border-cyan-400">
            </div>
            
            <div class="space-y-1">
                <label class="text-xs text-cyan-300 font-medium">Foto del recuerdo:</label>
                <input id="imageInput" type="file" accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-cyan-950 file:text-cyan-300 hover:file:bg-cyan-900 cursor-pointer">
            </div>

            <div class="space-y-1">
                <label class="text-xs text-cyan-300 font-medium">Selecciona el archivo MP3 local:</label>
                <input id="audioInput" type="file" accept="audio/mp3, audio/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-cyan-950 file:text-cyan-300 hover:file:bg-cyan-900 cursor-pointer">
            </div>

            <textarea id="descInput" placeholder="Descripción o historia..." class="w-full bg-slate-950 border border-cyan-900 rounded-xl p-3 text-sm text-slate-100 outline-none focus:border-cyan-400 h-24"></textarea>
            
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeModal()" class="px-4 py-2 text-slate-400 text-sm hover:text-white">Cancelar</button>
                <button onclick="saveMemory()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('stars-container');
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}vh`;
            star.style.left = `${Math.random() * 100}vw`;
            star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
            star.style.setProperty('--delay', `${Math.random() * 4}s`);
            container.appendChild(star);
        }

        const startDate = new Date(2025, 8, 19, 18, 0, 0); 
        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;
            if (diff > 0) {
                document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById('hours').innerText = Math.floor((diff / (1000 * 60 * 60)) % 24);
                document.getElementById('minutes').innerText = Math.floor((diff / 1000 / 60) % 60);
                document.getElementById('seconds').innerText = Math.floor((diff / 1000) % 60);
            }
        }
        setInterval(updateCounter, 1000);
        updateCounter();

        let memories = JSON.parse(localStorage.getItem('space_memories')) || [
            { 
                title: 'El Gran paso', 
                category: 'Cine', 
                date: '2025-09-01', 
                desc: 'Aquel día con esa invitación, le abriste la puerta de tu vida a quien se llegaría a convertir en el amor de tu vida.', 
                image: 'https://github.com/Cypher891111/Nuestra_Historia/raw/7ded337537555e7d8f0f84fcd7819be3e635275e/cafe.jpg', 
                audioUrl: 'https://github.com/Cypher891111/Nuestra_Historia/raw/7ded337537555e7d8f0f84fcd7819be3e635275e/soloqueriauncafe.mp3',
                audioName: 'soloqueriauncafe.mp3' 
            },
            { 
                title: 'Noches de Cine', 
                category: 'Cine', 
                date: '2025-10-10', 
                desc: 'Una de las películas que no habías visto y se convirtió en nuestro Himno, porque nos identifica.', 
                image: 'https://github.com/Cypher891111/Nuestra_Historia/raw/7ded337537555e7d8f0f84fcd7819be3e635275e/images.jpg', 
                audioUrl: 'https://github.com/Cypher891111/Nuestra_Historia/raw/7ded337537555e7d8f0f84fcd7819be3e635275e/desire.mp3',
                audioName: 'desire.mp3' 
            }
        ];

        let currentFilter = 'Cine';

        function filterCategory(category, btnElement) {
            currentFilter = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-cyan-600', 'text-white', 'shadow');
                btn.classList.add('bg-slate-900/80', 'text-slate-300');
            });
            btnElement.classList.remove('bg-slate-900/80', 'text-slate-300');
            btnElement.classList.add('bg-cyan-600', 'text-white', 'shadow');
            renderMemories();
        }

        function renderMemories() {
            const gallery = document.getElementById('gallery');
            const filtered = memories.filter(m => m.category === currentFilter);

            if (filtered.length === 0) {
                gallery.innerHTML = `<p class="text-slate-400 text-center col-span-1 md:col-span-2 py-8 text-sm">No hay recuerdos en esta categoría todavía. ¡Haz clic en "Añadir Recuerdo" para crear uno!</p>`;
                return;
            }

            gallery.innerHTML = filtered.map((m) => {
                const realIndex = memories.indexOf(m);

                return `
                    <div class="bg-slate-950/80 backdrop-blur-sm rounded-2xl shadow-lg border border-cyan-900/40 overflow-hidden hover:border-cyan-400/50 transition flex flex-col relative">
                        ${m.image ? `<img src="${m.image}" alt="${m.title}" class="w-full h-48 object-cover border-b border-cyan-900/40">` : ''}

                        <div class="p-5 md:p-6 space-y-3 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-xs px-2.5 py-1 rounded-full bg-cyan-950 text-cyan-300 font-medium border border-cyan-800/50">${m.category}</span>
                                    <div class="flex gap-3">
                                        <button onclick="editMemory(${realIndex})" title="Editar" class="text-slate-400 hover:text-cyan-300 text-sm transition p-1"><i class="fas fa-edit"></i></button>
                                        <button onclick="deleteMemory(${realIndex})" title="Eliminar" class="text-slate-400 hover:text-rose-400 text-sm transition p-1"><i class="fas fa-trash"></i></button>
                                    </div>
                                </div>
                                ${m.date ? `<span class="text-xs text-cyan-400/80 block mt-2">${m.date}</span>` : ''}
                                <h4 class="text-lg font-bold text-slate-100">${m.title}</h4>
                                ${m.audioName ? `<p class="text-xs text-cyan-300/80 italic font-light mt-0.5">🎵 ${m.audioName}</p>` : ''}
                                <p class="text-slate-300 text-sm leading-relaxed mt-1">${m.desc}</p>
                            </div>

                            <!-- Reproductor de Audio MP3 -->
                            ${m.audioUrl ? `
                                <div class="mt-4 pt-3 border-t border-cyan-900/50 space-y-2">
                                    <audio controls class="w-full h-10 accent-cyan-500">
                                        <source src="${m.audioUrl}" type="audio/mp3">
                                    </audio>
                                    <a href="${m.audioUrl}" download="${m.audioName}" class="inline-flex items-center gap-1.5 text-xs text-sky-300 hover:text-cyan-200 transition font-medium">
                                        <i class="fas fa-download"></i> Descargar archivo MP3
                                    </a>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openModal(index = -1) {
            document.getElementById('editIndex').value = index;
            if (index >= 0) {
                const m = memories[index];
                document.getElementById('modalTitle').innerText = 'Editar Momento';
                document.getElementById('titleInput').value = m.title;
                document.getElementById('categoryInput').value = m.category || 'Cine';
                document.getElementById('dateInput').value = m.date || '';
                document.getElementById('descInput').value = m.desc;
            } else {
                document.getElementById('modalTitle').innerText = 'Añadir Nuevo Momento';
                document.getElementById('titleInput').value = '';
                document.getElementById('categoryInput').value = currentFilter;
                document.getElementById('dateInput').value = '';
                document.getElementById('descInput').value = '';
            }
            document.getElementById('imageInput').value = '';
            document.getElementById('audioInput').value = '';
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function editMemory(index) {
            openModal(index);
        }

        function deleteMemory(index) {
            if (confirm('¿Estás seguro de que quieres eliminar esta publicación?')) {
                memories.splice(index, 1);
                localStorage.setItem('space_memories', JSON.stringify(memories));
                renderMemories();
            }
        }

        function saveMemory() {
            const index = parseInt(document.getElementById('editIndex').value);
            const title = document.getElementById('titleInput').value;
            const category = document.getElementById('categoryInput').value;
            const date = document.getElementById('dateInput').value;
            const desc = document.getElementById('descInput').value;
            const imageInput = document.getElementById('imageInput');
            const audioInput = document.getElementById('audioInput');

            if (!title || !desc) {
                alert('Por favor completa al menos el título y la descripción.');
                return;
            }

            let imageData = index >= 0 ? memories[index].image : '';
            let audioUrl = index >= 0 ? memories[index].audioUrl : '';
            let audioName = index >= 0 ? memories[index].audioName : '';

            if (audioInput.files && audioInput.files[0]) {
                audioName = audioInput.files[0].name;
                audioUrl = URL.createObjectURL(audioInput.files[0]);
            }

            const finishSaving = () => {
                try {
                    if (index >= 0) {
                        memories[index] = { title, category, date, desc, image: imageData, audioUrl, audioName };
                    } else {
                        memories.unshift({ title, category, date, desc, image: imageData, audioUrl, audioName });
                    }
                    localStorage.setItem('space_memories', JSON.stringify(memories));
                    currentFilter = category;
                    
                    document.querySelectorAll('.category-btn').forEach(btn => {
                        if(btn.textContent.includes(category)) {
                            btn.classList.add('bg-cyan-600', 'text-white', 'shadow');
                            btn.classList.remove('bg-slate-900/80', 'text-slate-300');
                        } else {
                            btn.classList.remove('bg-cyan-600', 'text-white', 'shadow');
                            btn.classList.add('bg-slate-900/80', 'text-slate-300');
                        }
                    });

                    renderMemories();
                    closeModal();
                } catch (e) {
                    alert('Error al guardar el recuerdo.');
                }
            };

            if (imageInput.files && imageInput.files[0]) {
                const readerImg = new FileReader();
                readerImg.onload = function(e) {
                    imageData = e.target.result;
                    finishSaving();
                };
                readerImg.readAsDataURL(imageInput.files[0]);
            } else {
                finishSaving();
            }
        }

        renderMemories();
    </script>
</body>
</html>
